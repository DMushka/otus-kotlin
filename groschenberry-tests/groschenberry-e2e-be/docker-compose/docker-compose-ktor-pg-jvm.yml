# Конфигурация для spring + (в перспективе) postgresql

version: '3.9'
services:
  app-ktor:
    image: groschenberry-app-ktor-jvm:0.0.1
    ports:
      - "8080:8080"
    environment:
      DB_TYPE_PROD: "psql"
      MKPLADS_HOST: "psql"
      MKPLADS_PORT: 5432
      MKPLADS_DB: "groschenberry_cis"
      MKPLADS_USER: "postgres"
      MKPLADS_PASS: "groschenberry-pass"
    depends_on:
      psql:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]


  psql:
    image: postgres
    #    ports:
    #      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "groschenberry-pass"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "groschenberry_cis"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  liquibase:
    image: "groschenberry-migration-pg:0.1.0"
    environment:
      LIQUIBASE_URL:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://psql:5432/groschenberry_cis
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: "groschenberry-pass"
      LIQUIBASE_LIQUIBASE_SCHEMA_NAME: public
    #      tableName: groschenberry_cis

    depends_on:
      psql:
        condition: service_healthy
